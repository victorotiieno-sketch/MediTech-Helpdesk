<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTech | Asset Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="brand brand-inline">
        <div class="logo-icon" aria-label="MediTech logo">
            <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M16 18h8l7 15 7-15h8v28h-7V30l-8 17-8-17v16h-7z" fill="#ffffff"></path>
                <path d="M38 13h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#9be7ff"></path>
            </svg>
        </div>
        <div class="brand-copy">
            <h1>MediTech</h1>
            <p>Hospital ICT Help Desk</p>
        </div>
    </div>

    <div class="user-area">
        <div>
            <strong>{{ full_name }}</strong>
            <span>{{ role }}</span>
        </div>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</header>

<div class="dashboard-layout">
    <aside class="sidebar">
        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            {% include "partials/ticket_navigation.html" %}

            <a href="{{ url_for('systems_directory') }}">Systems Directory</a>
            <a href="{{ url_for('assets') }}" {% if request.endpoint in ['assets', 'create_asset', 'asset_details', 'edit_asset', 'update_asset_status'] %}class="active"{% endif %}>Asset Manager</a>

            {% if role == "Administrator" %}
                <a href="{{ url_for('configuration') }}">Configuration</a>
                <a href="{{ url_for('admin_panel') }}">Administration</a>
            {% endif %}
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

</body>
</html>
